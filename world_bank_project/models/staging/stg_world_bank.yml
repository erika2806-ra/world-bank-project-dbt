version: 2

models:
  - name: stg_world_bank
    description: "Données World Bank nettoyées au format long. Une ligne correspond à la version la plus récente d'une observation entité-année-indicateur."

    columns:
      - name: indicator_code
        description: "Code officiel World Bank de l'indicateur."
        data_tests:
          - not_null

      - name: indicator_name
        description: "Nom de l'indicateur."

      - name: country_code
        description: "Code de l'entité issu de l'objet country."

      - name: country_name
        description: "Nom du pays, territoire ou agrégat."
        data_tests:
          - not_null

      - name: countryiso3code
        description: "Code ISO3 du pays ou territoire. Peut être NULL pour certains agrégats de la Banque mondiale"
        
      - name: type_entite
        description: "Type d'entité : pays_ou_territoire ou agregat."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pays_ou_territoire
                  - agregat
                  
      - name: annee
        description: "Année de l'observation."
        data_tests:
          - not_null

      - name: valeur
        description: "Valeur publiée par la Banque mondiale. NULL signifie que la donnée n'est pas disponible."

      - name: unit
        description: "Unité associée à l'indicateur."

      - name: obs_status
        description: "Statut de l'observation."

      - name: decimal_places
        description: "Nombre de décimales indiqué par l'API."

      - name: row_hash
        description: "Hash de la version brute de l'observation."
        data_tests:
          - not_null

      - name: inserted_at
        description: "Date et heure d'ingestion dans BigQuery."
        data_tests:
          - not_null